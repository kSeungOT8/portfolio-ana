<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio Ana | Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      box-shadow: 0 15px 40px #0004;
    }

    h1, h2 {
      text-align: center;
    }

    .subtitulo {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #475569;
      border-radius: 9px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #38bdf8;
      color: #082f49;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    .secundario {
      background: #334155;
      color: white;
    }

    #mensagem {
      text-align: center;
      margin-top: 16px;
      color: #fbbf24;
      overflow-wrap: anywhere;
    }

    #dashboard {
      width: 100%;
      max-width: 650px;
    }

    .painel {
      margin-top: 20px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>
  <main class="card" id="login">
    <h1>Bem-vinda!</h1>
    <p class="subtitulo">Portfólio Ana | Acesse sua conta</p>

    <form id="formLogin">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="senha">Senha</label>
      <input id="senha" type="password" required
        minlength="6" autocomplete="current-password">

      <button type="submit">Entrar</button>
    </form>

    <button class="secundario" id="btnCadastro" type="button">
      Criar uma conta
    </button>

    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>

  <main class="card oculto" id="dashboard">
    <h1>Meu Dashboard</h1>
    <p class="subtitulo">Você entrou na sua conta!</p>

    <div class="painel">
      <h2>Bem-vinda ao seu portfólio</h2>
      <p>Este é o espaço inicial do seu painel.</p>
      <p><strong>Conta:</strong> <span id="usuarioAtual"></span></p>
    </div>

    <button id="btnSair" type="button">Sair da conta</button>
    <p id="mensagemPainel" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Use a URL do seu projeto e a sua Publishable key.
    const SUPABASE_URL = "https://ouabxqtwsfugebnzslzv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3ugFfMjcp7h06mkJsCwZaA_gZ9WPR8j";

    const { createClient } = supabase;
    const banco = createClient(SUPABASE_URL, SUPABASE_KEY);

    const telaLogin = document.getElementById("login");
    const telaDashboard = document.getElementById("dashboard");
    const mensagem = document.getElementById("mensagem");

    function mostrarMensagem(texto) {
      mensagem.textContent = texto;
    }

    function mostrarDashboard(usuario) {
      telaLogin.classList.add("oculto");
      telaDashboard.classList.remove("oculto");
      document.getElementById("usuarioAtual").textContent =
        usuario.email || "Usuário conectado";
    }

    function mostrarLogin() {
      telaDashboard.classList.add("oculto");
      telaLogin.classList.remove("oculto");
      mostrarMensagem("");
    }

    document.getElementById("formLogin").addEventListener("submit",
      async function(event) {
        event.preventDefault();
        mostrarMensagem("Verificando seus dados...");

        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;

        const { data, error } = await banco.auth.signInWithPassword({
          email: email,
          password: senha
        });

        if (error) {
          mostrarMensagem("Não foi possível entrar. Confira o e-mail e a senha.");
          return;
        }

        mostrarDashboard(data.user);
      }
    );

    document.getElementById("btnCadastro").addEventListener("click",
      async function() {
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;

        if (!email || !senha || senha.length < 6) {
          mostrarMensagem("Digite um e-mail e uma senha com pelo menos 6 caracteres.");
          return;
        }

        mostrarMensagem("Criando sua conta...");

        const { data, error } = await banco.auth.signUp({
          email: email,
          password: senha
        });

        if (error) {
          mostrarMensagem("Erro no cadastro: " + error.message);
          return;
        }

        if (data.session && data.user) {
          mostrarDashboard(data.user);
        } else {
          mostrarMensagem(
            "Cadastro realizado! Se a confirmação de e-mail estiver ativa, confira sua caixa de entrada."
          );
        }
      }
    );

    document.getElementById("btnSair").addEventListener("click",
      async function() {
        const { error } = await banco.auth.signOut();

        if (error) {
          document.getElementById("mensagemPainel").textContent =
            "Não foi possível sair. Tente novamente.";
          return;
        }

        mostrarLogin();
      }
    );

    async function verificarSessao() {
      const { data, error } = await banco.auth.getSession();

      if (error) {
        mostrarMensagem("Não foi possível verificar sua sessão.");
        return;
      }

      if (data.session) {
        mostrarDashboard(data.session.user);
      }
    }

    verificarSessao();
  </script>
</body>
</html>
