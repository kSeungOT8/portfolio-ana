
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ana Liz | Portfólio</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080b14;
            color: #fff;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid #25344b;
        }

        .logo {
            font-size: 27px;
            letter-spacing: 3px;
        }

        .logo span {
            color: #20baff;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #a8bad4;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.ativo {
            color: #20baff;
        }

        main {
            min-height: 75vh;
            display: flex;
            align-items: center;
            padding: 60px 12%;
        }

        .conteudo {
            max-width: 700px;
        }

        .etiqueta {
            color: #20baff;
            letter-spacing: 4px;
            font-size: 12px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 65px);
            line-height: 1.15;
            margin-bottom: 20px;
        }

        h1 span {
            color: #20baff;
        }

        .descricao {
            color: #91a5c4;
            font-size: 17px;
            line-height: 1.8;
            max-width: 580px;
            margin-bottom: 35px;
        }

        .botao {
            display: inline-block;
            padding: 14px 25px;
            background: #12aef5;
            color: #06101c;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao:hover {
            background: #54caff;
            transform: translateY(-3px);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #627590;
            font-size: 12px;
            border-top: 1px solid #25344b;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                gap: 17px;
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                padding: 60px 8%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">ANA<span>.</span></div>

        <nav>
            <a href="index.html" class="ativo">Início</a>
            <a href="quemsoueu.html">Quem sou eu</a>
            <a href="contato.html">Contatos</a>
        </nav>
    </header>

    <main>
        <section class="conteudo">

            <p class="etiqueta">PORTFÓLIO DIGITAL</p>

            <h1>
                Olá, eu sou <span>Ana Liz.</span>
            </h1>

            <p class="descricao">
                Seja bem-vindo(a) ao meu espaço digital.
                Aqui você poderá conhecer um pouco sobre mim,
                minha trajetória, meus conhecimentos e meus objetivos.
            </p>

            <a href="quemsoueu.html" class="botao">
                CONHEÇA MINHA HISTÓRIA
            </a>

        </section>
    </main>

    <footer>
        © 2026 Ana Liz | Portfólio Digital
    </footer>

</body>
</html>
